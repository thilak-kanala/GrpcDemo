syntax = "proto3";

option csharp_namespace = "GrpcServer.Protos.TST";

package tst;

// Message representing a TST User
message TstUserMessage {
  string id = 1;
  string user_name = 2;
  string email = 3;
  string tst_user_extension1 = 4;
  string tst_user_extension2 = 5;
}

// Request message for GetAllUsers
message GetAllUsersRequest {
}

// Response message for GetAllUsers
message GetAllUsersResponse {
  repeated TstUserMessage users = 1;
}

// Request message for GetUserById
message GetUserByIdRequest {
  string id = 1;
}

// Response message for GetUserById
message GetUserByIdResponse {
  TstUserMessage user = 1;
}

// Request message for CreateUser
message CreateUserRequest {
  string id = 1;
  string user_name = 2;
  string email = 3;
  string tst_user_extension1 = 4;
  string tst_user_extension2 = 5;
}

// Response message for CreateUser
message CreateUserResponse {
  TstUserMessage user = 1;
}

// Request message for UpdateUser
message UpdateUserRequest {
  string id = 1;
  string user_name = 2;
  string email = 3;
  string tst_user_extension1 = 4;
  string tst_user_extension2 = 5;
}

// Response message for UpdateUser
message UpdateUserResponse {
  TstUserMessage user = 1;
}

// Request message for DeleteUser
message DeleteUserRequest {
  string id = 1;
}

// Response message for DeleteUser
message DeleteUserResponse {
  bool success = 1;
}

// Service definition for TST User operations
// Provides CRUD operations for user entities
service TstUserService {
  // Retrieves all users from the TST system
  rpc GetAllUsers (GetAllUsersRequest) returns (GetAllUsersResponse);
  
  // Retrieves a specific user by their unique identifier
  rpc GetUserById (GetUserByIdRequest) returns (GetUserByIdResponse);
  
  // Creates a new user in the TST system
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  
  // Updates an existing user in the TST system
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  
  // Deletes a user from the TST system
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}

