syntax = "proto3";

option csharp_namespace = "GrpcServer.Protos.TST";

package tst;

import "Common/base_user.proto";

// Message representing a TST User
// Extends the base user message with TST-specific fields
message TstUserMessage {
  common.BaseUserMessage base = 1;
  string tst_user_extension1 = 2;
  string tst_user_extension2 = 3;
}

// Response message for GetAllUsers
message GetAllUsersResponse {
  repeated TstUserMessage users = 1;
}

// Response message for GetUserById
message GetUserByIdResponse {
  TstUserMessage user = 1;
}

// Unified request message for both Create and Update User operations
// Extends the base user message with TST-specific fields
message TstUserRequest {
  common.BaseUserMessage base = 1;
  string tst_user_extension1 = 2;
  string tst_user_extension2 = 3;
}

// Unified response message for both CreateUser and UpdateUser operations
message TstUserResponse {
  TstUserMessage user = 1;
}


// Service definition for TST User operations
// Provides CRUD operations for user entities
service TstUserGrpcServiceDefinition {
  // Retrieves all users from the TST system
  rpc GetAllUsers (common.GetAllUsersRequest) returns (GetAllUsersResponse);
  
  // Retrieves a specific user by their unique identifier
  rpc GetUserById (common.GetUserByIdRequest) returns (GetUserByIdResponse);
  
  // Creates a new user in the TST system
  rpc CreateUser (TstUserRequest) returns (TstUserResponse);
  
  // Updates an existing user in the TST system
  rpc UpdateUser (TstUserRequest) returns (TstUserResponse);
  
  // Deletes a user from the TST system
  rpc DeleteUser (common.DeleteUserRequest) returns (common.DeleteUserResponse);
}

