syntax = "proto3";

option csharp_namespace = "GrpcServer.Protos.TST";

package tst;

// Message representing a TST Group
message TstGroupMessage {
  string id = 1;
  string display_name = 2;
  string tst_group_extension1 = 3;
  string tst_group_extension2 = 4;
}

// Request message for GetAllGroups
message GetAllGroupsRequest {
}

// Response message for GetAllGroups
message GetAllGroupsResponse {
  repeated TstGroupMessage groups = 1;
}

// Request message for GetGroupById
message GetGroupByIdRequest {
  string id = 1;
}

// Response message for GetGroupById
message GetGroupByIdResponse {
  TstGroupMessage group = 1;
}

// Request message for CreateGroup
message CreateGroupRequest {
  string id = 1;
  string display_name = 2;
  string tst_group_extension1 = 3;
  string tst_group_extension2 = 4;
}

// Response message for CreateGroup
message CreateGroupResponse {
  TstGroupMessage group = 1;
}

// Request message for UpdateGroup
message UpdateGroupRequest {
  string id = 1;
  string display_name = 2;
  string tst_group_extension1 = 3;
  string tst_group_extension2 = 4;
}

// Response message for UpdateGroup
message UpdateGroupResponse {
  TstGroupMessage group = 1;
}

// Request message for DeleteGroup
message DeleteGroupRequest {
  string id = 1;
}

// Response message for DeleteGroup
message DeleteGroupResponse {
  bool success = 1;
}

// Service definition for TST Group operations
// Provides CRUD operations for group entities
service TstGroupService {
  // Retrieves all groups from the TST system
  rpc GetAllGroups (GetAllGroupsRequest) returns (GetAllGroupsResponse);
  
  // Retrieves a specific group by its unique identifier
  rpc GetGroupById (GetGroupByIdRequest) returns (GetGroupByIdResponse);
  
  // Creates a new group in the TST system
  rpc CreateGroup (CreateGroupRequest) returns (CreateGroupResponse);
  
  // Updates an existing group in the TST system
  rpc UpdateGroup (UpdateGroupRequest) returns (UpdateGroupResponse);
  
  // Deletes a group from the TST system
  rpc DeleteGroup (DeleteGroupRequest) returns (DeleteGroupResponse);
}

