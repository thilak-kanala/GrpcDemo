syntax = "proto3";

option csharp_namespace = "GrpcServer.Protos.TST";

package tst;

import "Common/base_group.proto";

// Message representing a TST Group
// Extends the base group message with TST-specific fields
message TstGroupMessage {
  common.BaseGroupMessage base = 1;
  string tst_group_extension1 = 2;
  string tst_group_extension2 = 3;
}

// Response message for GetAllGroups
message GetAllGroupsResponse {
  repeated TstGroupMessage groups = 1;
}

// Response message for GetGroupById
message GetGroupByIdResponse {
  TstGroupMessage group = 1;
}

// Unified request message for both Create and Update Group operations
// Extends the base group message with TST-specific fields
message TstGroupRequest {
  common.BaseGroupMessage base = 1;
  string tst_group_extension1 = 2;
  string tst_group_extension2 = 3;
}

// Unified response message for both CreateGroup and UpdateGroup operations
message TstGroupResponse {
  TstGroupMessage group = 1;
}


// Service definition for TST Group operations
// Provides CRUD operations for group entities
service TstGroupService {
  // Retrieves all groups from the TST system
  rpc GetAllGroups (common.GetAllGroupsRequest) returns (GetAllGroupsResponse);
  
  // Retrieves a specific group by its unique identifier
  rpc GetGroupById (common.GetGroupByIdRequest) returns (GetGroupByIdResponse);
  
  // Creates a new group in the TST system
  rpc CreateGroup (TstGroupRequest) returns (TstGroupResponse);
  
  // Updates an existing group in the TST system
  rpc UpdateGroup (TstGroupRequest) returns (TstGroupResponse);
  
  // Deletes a group from the TST system
  rpc DeleteGroup (common.DeleteGroupRequest) returns (common.DeleteGroupResponse);
}
